  pres.addEventListener('wheel', e => { e.preventDefault(); if (open || busy) return; const d = e.deltaMode === 1 ? e.deltaY*30 : e.deltaY + e.deltaX; target += clamp(d, -90, 90)/380; wheelAt = performance.now(); }, {passive:false});
  pres.addEventListener('pointerdown', e => { if (busy || e.target.closest('button')) return; drag = {y:e.clientY, t0:target, moved:0}; pres.setPointerCapture(e.pointerId); });
  pres.addEventListener('pointermove', e => { if (!drag) return; const dy = e.clientY - drag.y; drag.moved = Math.max(drag.moved, Math.abs(dy)); if (drag.moved > 6){ target = drag.t0 - dy/geo().gap; wheelAt = performance.now(); } });
  pres.addEventListener('pointerup', e => {
    const d = drag; drag = null; if (!d || d.moved > 6) return;
    const el = document.elementFromPoint(e.clientX, e.clientY), c = el && el.closest('.pcard'); if (!c) return;
    const i = cards.indexOf(c); if (i === Math.round(pos)) openPage(i); else target = i;
  });
  idx.addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b){ target = +b.dataset.k; wheelAt = performance.now(); } });

  /* ---------- the chapter page ---------- */
  const page = document.createElement('div'); page.id = 'ppage'; page.setAttribute('role', 'dialog'); page.setAttribute('aria-modal', 'true'); document.body.appendChild(page);
  let pi = 0, over = 0, under = 0, lockUntil = 0, ps = 0;
  let solo = false;
  const rowHTML = (c, i) => (c.row || c.p) ? `<div class="ch-cap">${c.row ? `<div class="cm">${Object.entries(c.row).map(([k, v]) => `<span><b>${k}</b>${v}</span>`).join('')}</div>` : ''}${c.p ? `<p>${c.p}</p>` : ''}</div>` : '';
  function pageHTML(i){
    const c = H[i], n = solo ? null : H[i + 1];
    const prev = !solo && i > 0 ? `<button class="pp-prev" data-prev="${i - 1}"><span>↑</span>Previous · ${pad(i)} / ${pad(H.length)} · ${H[i - 1].t}</button>` : '';
    const next = n ? `<button class="pp-next" data-next="${i + 1}"><span class="e">Next · ${pad(i + 2)} / ${pad(H.length)}</span><b>${n.t}</b><i>${media(n)}</i></button>`
                   : solo ? `<button class="pp-next end" data-close><span class="e">Back to Explore</span><b>Return to the globe</b></button>`
                   : `<div class="pp-exits"><span class="e">End of the story · Thank you</span><a class="go" href="${LIVE_URL}" target="_blank" rel="noopener">Open Astra <span>↗</span></a><button class="go" data-explore>Explore everything <span>→</span></button></div>`;
    const inner = (c.hero ? c.hero() : '') + (c.body ? c.body() : '')
               + (c.questions ? `<ol class="fq">${c.questions.map((q, k) => `<li><span>${pad(k + 1)}</span><p>${q}</p></li>`).join('')}</ol>` : '');
    const hero = `<div class="pp-hero stage">${inner}</div>`;
    const ex = c.a && c.id !== 'astra' && c.id !== 'future' ? `<div class="ch-exw">${exLink(c.a.id)}</div>` : '';
    return `<button class="pp-x" aria-label="Close" title="Close (Esc)">×</button><article class="ch-${c.id}">${prev}
      <p class="pp-eyebrow ch-eb">${pad(i + 1)} · ${c.k}</p>
      <h1>${c.h}</h1>
      ${hero}
      ${rowHTML(c, i)}
      ${ex}
      ${next}</article>`;
  }
  // steps: everything marked data-s appears when the page's step reaches it; the article carries s1…sN for chapter-specific states
  function stepMax(){ return H[pi].steps || 0; }
  let autoUntil = 0;
  function applySteps(scroll){
    const art = page.querySelector('article'); if (!art) return;
    page.querySelectorAll('[data-s]').forEach(e => e.classList.toggle('on', +e.dataset.s <= ps));
    for (let k = 1; k <= 6; k++) art.classList.toggle('s' + k, ps >= k);
    if (scroll && ps > 0){
      const els = [...page.querySelectorAll(`[data-s="${ps}"]`)]; if (!els.length) return;
      const top = Math.min(...els.map(e => e.getBoundingClientRect().top)), bot = Math.max(...els.map(e => e.getBoundingClientRect().bottom));
      if (bot > innerHeight - 70 || top < 60){ autoUntil = performance.now() + 1200; } if (bot > innerHeight - 70 || top < 60) page.scrollBy({top: Math.min(bot - innerHeight + 110, top - 90), behavior: RM ? 'auto' : 'smooth'});
    }
  }
  function wire(){
    page.querySelectorAll('.sl-tabs button').forEach(b => b.onclick = e => {
      e.stopPropagation(); const r = b.dataset.role;
      page.querySelectorAll('.sl-tabs button').forEach(x => x.classList.toggle('on', x === b));
      page.querySelectorAll('.sl-b').forEach(p => p.hidden = p.dataset.for !== r);
    });
  }
  let fqObs = null;
  function revealQuestions(){
    if (fqObs) fqObs.disconnect();
    const lis = [...page.querySelectorAll('.fq li')]; if (!lis.length) return;
    if (RM || !('IntersectionObserver' in window)){ lis.forEach(li => li.classList.add('in')); return; }
    let q = 0;
    fqObs = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; fqObs.unobserve(e.target); const d = 700 + (q++)*420; setTimeout(() => e.target.classList.add('in'), d); setTimeout(() => q = Math.max(0, q - 1), d + 50); }), {root:page, threshold:.35});
    lis.forEach(li => fqObs.observe(li));
  }
  function fill(i, atEnd){
    pi = i; page.innerHTML = pageHTML(i); ps = atEnd ? stepMax() : 0; wire(); applySteps(false); revealQuestions(); markSeen(H[i]);
  }
  const flipFrom = (el, r) => { const b = el.getBoundingClientRect(); return `translate(${(r.left - b.left).toFixed(1)}px,${(r.top - b.top).toFixed(1)}px) scale(${(r.width/b.width).toFixed(4)},${(r.height/b.height).toFixed(4)})`; };
  function openPage(i, fromRect){
    if (open && !fromRect) return;
    open = true; over = 0; lockUntil = performance.now() + 700;
    const r = fromRect || cards[i].getBoundingClientRect(), tr = tEl.getBoundingClientRect();
    setLit(LIT >= 0 && i >= LIT);
    fill(i, false); page.scrollTop = 0; page.classList.add('on'); pres.classList.add('away');
    const hero = page.querySelector('.pp-hero'), h1 = page.querySelector('h1');
    if (!RM){
      hero.animate([{transform:flipFrom(hero, r), borderRadius:'12px'}, {transform:'none', borderRadius:'14px'}], {duration:820, easing:'cubic-bezier(.7,0,.2,1)'});
      if (!fromRect) h1.animate([{opacity:0, transform:'translateY(24px)'}, {opacity:1, transform:'none'}], {duration:720, easing:'cubic-bezier(.16,1,.3,1)'});
    }
    setTimeout(() => page.querySelector('.pp-x').focus({preventScroll:true}), 300);
  }
  function closePage(){
    if (!open) return;
    if (solo){
      const hero = page.querySelector('.pp-hero'), a = H[pi].a, r = GL && a && GL.rect(a);
      page.classList.add('closing');
      const done = () => { page.classList.remove('on', 'closing'); page.innerHTML = ''; open = false; solo = false; pres.classList.remove('away'); };
      if (RM || !r || !r.width) return done();
      hero.animate([{transform:'none', opacity:1}, {transform:flipFrom(hero, r), opacity:.6}], {duration:700, easing:'cubic-bezier(.7,0,.2,1)', fill:'forwards'}).onfinish = done;
      return;
    }
    page.scrollTop = 0;
    pos = target = pi; vel = 0; shown = -1; layout(); setText(pi);
    pres.classList.remove('away');
    const hero = page.querySelector('.pp-hero'), r = cards[pi].getBoundingClientRect();
    page.classList.add('closing');
    const done = () => { page.classList.remove('on', 'closing'); page.innerHTML = ''; open = false; };
    if (RM) return done();
    hero.animate([{transform:'none'}, {transform:flipFrom(hero, r)}], {duration:700, easing:'cubic-bezier(.7,0,.2,1)', fill:'forwards'}).onfinish = done;
  }
  function fadeOutPage(dir, keep, then){
    const art = page.querySelector('article'); if (RM || !art){ then(); return; }
    [...art.children].forEach(c => { if (c === keep) return; c.animate([{opacity:1, transform:'none'}, {opacity:0, transform:`translateY(${dir*-28}px)`}], {duration:260, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards'}); });
    setTimeout(then, 250);
  }
  function prevPage(i){
    lockUntil = performance.now() + 1000; over = under = 0;
    fadeOutPage(-1, null, () => prevPageIn(i));
  }
  function prevPageIn(i){
    over = under = 0; lockUntil = performance.now() + 700;
    setLit(LIT >= 0 && i >= LIT);
    fill(i, true); const art = page.querySelector('article'); art.classList.add('back');
    page.scrollTop = page.scrollHeight;
    if (!RM) art.animate([{transform:'translateY(-48px)', opacity:0}, {transform:'none', opacity:1}], {duration:700, easing:'cubic-bezier(.16,1,.3,1)'});
  }
  function nextPage(i){
    lockUntil = performance.now() + 1100; under = 0;
    const nx = page.querySelector('.pp-next'), th = nx && nx.querySelector('i');
    if (!th){ setLit(LIT >= 0 && i >= LIT); fill(i, false); page.scrollTop = 0; return; }
    const r0 = th.getBoundingClientRect();
    if (r0.bottom > innerHeight || r0.top < 0) page.scrollBy({top:r0.top - innerHeight*.35, behavior: RM ? 'auto' : 'smooth'});
    [...nx.children].forEach(c => { if (c !== th) c.animate([{opacity:1}, {opacity:0}], {duration:240, fill:'forwards'}); });
    setTimeout(() => fadeOutPage(1, nx, () => openPage(i, th.getBoundingClientRect())), r0.bottom > innerHeight ? 420 : 0);
  }
  // the presenter's two buttons: forward through steps, then into the next chapter; back the same way
  // a press during a transition is kept and played once it lands, so fast clicking never gets swallowed
  let qDir = 0, qT = 0;
  function queue(d){ qDir = d; clearTimeout(qT); qT = setTimeout(() => { const k = qDir; qDir = 0; k > 0 ? forward() : backward(); }, lockUntil - performance.now() + 30); }
  function forward(){
    if (performance.now() < lockUntil) return queue(1);
    if (ps < stepMax()){ ps++; applySteps(true); return; }
    if (!solo && pi < H.length - 1) nextPage(pi + 1);
  }
  function backward(){
    if (performance.now() < lockUntil) return queue(-1);
    if (ps > 0){ ps--; applySteps(false); return; }
    if (solo) return;
    if (pi > 0) prevPage(pi - 1); else closePage();
  }
  function toExplore(id){
    if (open){ page.classList.remove('on'); page.innerHTML = ''; open = false; pres.classList.remove('away'); }
    setMode('explore');
    if (id) setTimeout(() => GL.select(id), (RM ? 0 : 1500) + 300);
  }
  page.addEventListener('click', e => {
    if (e.target.closest('.pp-x') || e.target.closest('[data-close]')) return closePage();
    const x = e.target.closest('[data-ex]'); if (x) return toExplore(x.dataset.ex);
    if (e.target.closest('[data-explore]')) return toExplore(null);
    const n = e.target.closest('[data-next]'); if (n) nextPage(+n.dataset.next);
    const pv = e.target.closest('[data-prev]'); if (pv) prevPage(+pv.dataset.prev);
  });
  page.addEventListener('wheel', e => {
    const end = page.scrollTop + page.clientHeight >= page.scrollHeight - 2;
    const top = page.scrollTop <= 0;
    if (performance.now() < lockUntil || solo) return;
    if (e.deltaY > 0 && end){ under = 0; over += e.deltaY; if (over > 320 && pi < H.length - 1){ over = 0; ps = stepMax(); applySteps(false); nextPage(pi + 1); } }
    else if (e.deltaY < 0 && top){ over = 0; under -= e.deltaY; if (under > 320 && pi > 0){ under = 0; prevPage(pi - 1); } }
    else { over = 0; under = 0; }
  }, {passive:true});
  // scrolling down a page also reveals any steps that come into view, so a visitor without the keyboard still sees everything
  page.addEventListener('scroll', () => {
    if (!open || ps >= stepMax() || performance.now() < autoUntil || performance.now() - keyAt < 1500) return;
    let k = ps; page.querySelectorAll('[data-s]').forEach(el => { if (el.getBoundingClientRect().top < innerHeight*.72 && el.offsetParent) k = Math.max(k, Math.min(+el.dataset.s, ps + 1)); });
    if (k > ps && page.scrollTop > 40){ ps = k; applySteps(false); }
  }, {passive:true});

  let keyAt = 0;
  document.addEventListener('keydown', e => {
    keyAt = performance.now();
    if (mode !== 'present' || busy || /INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key; let used = true;
    const FWD = ['ArrowRight', 'ArrowDown', 'PageDown', ' '], BACK = ['ArrowLeft', 'ArrowUp', 'PageUp'];
    if (open){
      if (k === 'Escape') closePage();
      else if (FWD.includes(k)) forward();
      else if (BACK.includes(k)) backward();
      else if (k === 'Enter' && document.activeElement && document.activeElement.closest('#ppage') && document.activeElement !== page.querySelector('.pp-x')) used = false;
      else if (k === 'Enter') forward();
      else used = false;
    }
    else if (k === 'ArrowRight' || k === 'Enter' || k === ' ') openPage(Math.round(pos));
    else if (k === 'ArrowDown' || k === 'PageDown') target = Math.round(target) + 1;
    else if (k === 'ArrowUp' || k === 'PageUp' || k === 'ArrowLeft') target = Math.round(target) - 1;
    else if (k === 'Home') target = 0;
    else if (k === 'End') target = H.length - 1;
    else if (k === 'c' || k === 'C') toast('Notes live in Explore');
    else used = false;
    if (used){ e.preventDefault(); e.stopImmediatePropagation(); wheelAt = performance.now(); }
  }, true);

  /* ---------- moving between Explore and Present ---------- */
  const EASE = 'cubic-bezier(.62,0,.24,1)';
  const fromRect = r => ({cx:r.left + r.width/2, cy:r.top + r.height/2, w:r.width, h:r.height, rot:0});
  const T2 = (s, BW, BH) => `translate(${(s.cx - BW/2).toFixed(1)}px,${(s.cy - BH/2).toFixed(1)}px) rotate(${(s.rot || 0).toFixed(2)}deg) scale(${(s.w/BW).toFixed(4)},${(s.h/BH).toFixed(4)})`;
  function deckSpot(k){
    const g = geo(), j = k - (A.length - 1)/2;
    return {cx:g.cx + j*1.4, cy:g.cy - j*1.1, w:g.w*.9, h:g.h*.9, rot:((k*37) % 9 - 4)*.7};
  }
  const slotSpot = (h, p) => { const s = slot(h, p); return [{cx:s.cx, cy:s.cy, w:s.w*(1 - Math.min(Math.abs(s.d), 1.6)*.16), h:s.h*(1 - Math.min(Math.abs(s.d), 1.6)*.16), rot:s.rot}, Math.abs(s.d) > 1.85 ? 0 : 1 - Math.max(0, Math.abs(s.d) - .85)*.95]; };
  function fly(stops, ms, topId){
    const g = geo(), BW = g.w, BH = g.h, els = [];
    A.forEach((a, k) => {
      const s = stops(a, k); if (!s) return;
      const el = document.createElement('div'); el.className = 'fly'; el.style.width = BW + 'px'; el.style.height = BH + 'px'; el.innerHTML = media0(a);
      if (a.id === 'solution') el.innerHTML = sface();
      el.style.zIndex = a.id === topId ? 40 : 13 + (k % 20);
      document.body.appendChild(el); els.push(el);
      const order = Math.abs(k - (A.length - 1)/2);
      el.animate(s.map(([p, o, off]) => ({transform:T2(p, BW, BH), opacity:o, offset:off, easing:EASE})), {duration:ms, delay:RM ? 0 : order*9, fill:'forwards'});
    });
    return els;
  }
  const MS = RM ? 1 : 1500;
  function enter(){
    if (busy) return; busy = true;
    const R = GL.rects(); GL.leave();
    pos = target = 0; vel = 0; shown = -1;
    const els = fly((a, k) => {
      const start = R[k] && R[k].show ? [fromRect(R[k]), R[k].op] : [deckSpot(k), 0];
      const h = slotOf(a);
      const end = h >= 0 ? slotSpot(h, pos) : [Object.assign(deckSpot(k), {w:geo().w*.8, h:geo().h*.8}), 0];
      return [[start[0], start[1], 0], [deckSpot(k), 1, .52], [end[0], end[1], 1]];
    }, MS, null);
    document.body.classList.add('morph'); modeChrome('present');
    pres.classList.add('on', 'entering'); layout(); setText(Math.round(pos));
    GL.fadeOut();
    requestAnimationFrame(() => pres.classList.add('bg'));
    setTimeout(() => { pres.classList.remove('entering'); els.forEach(el => el.remove()); document.body.classList.remove('morph'); busy = false; }, MS + 120);
  }
  function leave(){
    if (busy) return; busy = true; setLit(false);
    if (open){ page.classList.remove('on'); page.innerHTML = ''; open = false; pres.classList.remove('away'); }
    const R = GL.prime(), p0 = pos;
    const els = fly((a, k) => {
      const h = slotOf(a);
      const start = h >= 0 ? slotSpot(h, p0) : [Object.assign(deckSpot(k), {w:geo().w*.8, h:geo().h*.8}), 0];
      const end = R[k] && R[k].show ? [fromRect(R[k]), R[k].op] : [deckSpot(k), 0];
      return [[start[0], start[1], 0], [deckSpot(k), 1, .46], [end[0], end[1], 1]];
    }, MS, null);
    document.body.classList.add('morph'); pres.classList.add('leaving'); pres.classList.remove('bg'); modeChrome('explore');
    setTimeout(() => GL.fadeIn(), RM ? 0 : MS*.5);
    setTimeout(() => { GL.showCards(); requestAnimationFrame(() => requestAnimationFrame(() => { els.forEach(el => el.remove()); pres.classList.remove('on', 'leaving'); document.body.classList.remove('morph'); busy = false; })); }, MS + 120);
  }
  addEventListener('resize', () => { if (mode === 'present' && !open) layout(); });
  document.addEventListener('keydown', e => { if (solo && open && e.key === 'Escape'){ e.preventDefault(); e.stopImmediatePropagation(); closePage(); } }, true);

  PV = {
    enter, leave,
    openSolo(id, r){ const i = H.findIndex(c => c.a && c.a.id === id); if (i < 0 || open) return; solo = true; openPage(i, r && r.width ? new DOMRect(r.left, r.top, r.width, r.height) : cards[i].getBoundingClientRect()); },
    goId(id){ const i = H.findIndex(c => c.a && c.a.id === id); if (i < 0) return; if (open) closePage(); target = i; wheelAt = performance.now(); },
    hero: H
  };
})();

/* ---------- start ---------- */
function start(){
  const [zmin] = zLimits();
  const z0 = Math.max(zmin*1.3, Math.min(.72, VW()/2600));
  const sx = BB.ex.x0 + (VW()/2 - 40)/z0, sy = BB.ex.y0 + (VH()/2 - 60)/z0;
  [cam.x, cam.y] = clampCenter(sx, sy, z0); cam.z = z0*.92; Object.assign(tgt, {x:cam.x, y:cam.y, z:z0});
  applyCam(); movePill(); drawMinimap(true); updateScrub();
  // reveal cards outward from the starting view
  const items = [...A.map(a => ({el:a.el, b:L.ex[a.id]})), ...F.filter(f => !f.drop).map(f => ({el:f.el, b:L.ex['f'+f.i]}))];
  items.forEach(it => { const d = Math.hypot(it.b.x+it.b.w/2-cam.x, it.b.y+it.b.h/2-cam.y); setTimeout(() => it.el.classList.remove('pre'), RM ? 0 : 120 + Math.min(1400, d*.35)); });
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => { sizeTrail(); sizeGlow(); movePill(); const [zmin,zmax] = zLimits(); tgt.z = clamp(tgt.z, zmin, zmax); camDirty = true; drawMinimap(true); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(movePill);
start();
})();
</script>
